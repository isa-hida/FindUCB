<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FindU: objetos perdidos UCB Cochabamba</title>
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/listado.css" />
</head>

<body>
  <header class="encabezado">
    <div class="contenedor encabezado__contenido">
      <h1 class="encabezado__titulo">FindU</h1>
      <p class="encabezado__subtitulo">Objetos perdidos UCB Cochabamba</p>
    </div>
  </header>

  <main class="contenedor">
    <form id="filtros-form" class="filtros" novalidate>
      <div class="filtros__campo">
        <label for="filtro-categoria">Categoría</label>
        <select id="filtro-categoria" name="categoria">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="filtros__campo">
        <label for="filtro-desde">Desde</label>
        <input type="date" id="filtro-desde" name="desde" />
      </div>
      <div class="filtros__campo">
        <label for="filtro-hasta">Hasta</label>
        <input type="date" id="filtro-hasta" name="hasta" />
      </div>
      <div class="filtros__acciones">
        <button type="submit" id="filtrar-button" class="boton">Filtrar</button>
        <button type="button" id="limpiar-filtros-button" class="boton boton--secundario">Limpiar filtros</button>
      </div>
      <p id="error-filtros" class="error filtros__error" role="alert" hidden></p>
    </form>

    <p id="sin-objetos-mensaje" class="listado__vacio" role="status" hidden></p>
    <div id="listado" class="listado"></div>
  </main>

  <script type="module" src="./src/pages/listado.js"></script>
</body>

</html>
