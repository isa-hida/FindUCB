<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registrar objeto hallado | FindU</title>
    <link rel="stylesheet" href="../src/styles/base.css" />
    <link rel="stylesheet" href="../src/styles/panel.css" />
    <link rel="stylesheet" href="../src/styles/entrega.css" />
</head>

<body>
    <header class="panel-encabezado">
        <a href="./index.html" class="panel-encabezado__volver">← Volver al panel</a>
        <h1 class="panel-encabezado__titulo">Nuevo aviso</h1>
    </header>

    <main class="contenedor panel panel--formulario">
        <section class="tarjeta tarjeta--formulario">
            <form id="nuevo-objeto-form" class="formulario" novalidate>

                <div class="campo">
                    <label for="foto-input">Foto del objeto <span class="campo__requerido">*</span></label>
                    <span class="campo__ayuda">Solo JPG o PNG</span>
                    <div class="dropzone-foto">
                        <input type="file" id="foto-input" name="foto" accept="image/png, image/jpeg, image/jpg"
                            class="dropzone-foto__input" />
                        <div id="dropzone-contenido">
                            <div class="dropzone-foto__icono">📤</div>
                            <div class="dropzone-foto__texto">Click para subir una foto</div>
                            <div class="dropzone-foto__subtexto">JPG o PNG</div>
                        </div>
                        <img id="foto-preview" alt="Vista previa" class="dropzone-foto__preview" hidden />
                    </div>
                </div>

                <div class="campo">
                    <label for="categoria">Categoría <span class="campo__requerido">*</span></label>
                    <select id="categoria" name="categoria">
                        <option value="">Seleccionar...</option>
                        <option value="Electrónicos">Electrónicos</option>
                        <option value="Documentos">Documentos</option>
                        <option value="Llaves">Llaves</option>
                        <option value="Ropa">Ropa</option>
                        <option value="Accesorios">Accesorios</option>
                        <option value="Mochilas y bolsos">Mochilas y bolsos</option>
                        <option value="Útiles">Útiles</option>
                        <option value="Botellas y termos">Botellas y termos</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="color">Color</label>
                    <input type="text" id="color" name="color" placeholder="Seleccionar o escribir color..." />
                </div>

                <div class="campo">
                    <label for="marca">Marca <span class="campo__opcional">(opcional)</span></label>
                    <input type="text" id="marca" name="marca" placeholder="Ej. Samsung, Nike, etc." />
                </div>

                <div class="campo">
                    <label for="descripcion">Descripción <span class="campo__requerido">*</span></label>
                    <textarea id="descripcion" name="descripcion" rows="4" maxlength="500"
                        placeholder="Describe el objeto: características, estado, detalles distintivos..."
                        class="campo__textarea"></textarea>
                    <div id="contador-caracteres" class="campo__contador">0 / 500</div>
                </div>

                <div class="campo">
                    <label for="senas">Señas particulares</label>
                    <input type="text" id="senas" name="senas" placeholder="Señas particulares adicionales..." />
                </div>

                <div class="campo">
                    <label for="lugar">Lugar donde se encontró/perdió</label>
                    <input type="text" id="lugar" name="lugar" placeholder="Seleccionar o escribir lugar..." />
                </div>

                <div class="campo">
                    <label for="fecha-hallazgo">Fecha de hallazgo</label>
                    <input type="date" id="fecha-hallazgo" name="fechaHallazgo" />
                </div>


                <div class="campo campo--oculto">
                    <label for="encontrado-nombre">Encontrado por (Nombre)</label>
                    <input type="text" id="encontrado-nombre" name="encontradoNombre" />
                </div>

                <div class="campo campo--oculto">
                    <label for="encontrado-celular">Encontrado por (Celular)</label>
                    <input type="text" id="encontrado-celular" name="encontradoCelular" />
                </div>

                <p id="error-mensaje" class="error" role="alert" hidden></p>
                <p id="exito-mensaje" class="exito" role="status" hidden></p>

                <div class="entrega__acciones formulario__acciones">
                    <button type="submit" id="registrar-button" class="boton">Publicar aviso</button>

                </div>
            </form>
        </section>
    </main>

    <script type="module" src="../src/pages/admin-nuevo.js"></script>
</body>

</html>
